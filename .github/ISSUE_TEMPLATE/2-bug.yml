name: Bug
description: Something that worked, or should work, does not.
labels: ["bug"]
projects: ["poslovna-com/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, step by step.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: URL, route, endpoint or job name.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshot, log lines, request ID, run link. Paste text rather than a picture where you can.
  - type: input
    id: since
    attributes:
      label: Since when
      placeholder: "since the 25.10 deploy / always / unknown"
